name: Build Profile Assets

# Re-renders the SVG cards so the "now" marker, years of experience, current
# roles and project star counts stay accurate without manual edits.
on:
  schedule:
    - cron: "0 1 * * 1" # 01:00 UTC every Monday (keeps star counts fresh)
  push:
    branches: [main]
    paths:
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_assets.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets README.md)" ]; then
            echo "Assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git commit -m "chore: re-render profile assets"
          git pull --rebase origin main
          git push
