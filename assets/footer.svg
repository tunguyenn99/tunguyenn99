    <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip-foot"><rect width="900" height="170" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip-foot)">
  <rect width="900" height="170" fill="#0A0E1A"/>
  <rect width="900" height="170" fill="url(#dots-foot)"/>
  <rect width="900" height="170" fill="url(#g1-foot)"/>
  <rect width="900" height="170" fill="url(#g2-foot)"/>
</g>
<rect x="0.5" y="0.5" width="899" height="169" rx="15.5" stroke="#1E293B"/>
