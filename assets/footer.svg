  <clipPath id="fc"><rect x="1" y="0" width="898" height="169" rx="15"/></clipPath>
</defs>
<text x="450.0" y="64" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="-0.5" fill="#E2E8F0">Thanks for stopping by.</text>
<text x="444.0" y="96" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14"><tspan fill="#34D399">❯</tspan><tspan fill="#22D3EE" dx="8">let's build data people can trust</tspan></text>
