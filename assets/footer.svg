<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" fill="none" role="img" aria-label="Thanks for stopping by">
<title>Thanks for stopping by</title>
<style>
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wave{animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(-300px)}}
</style>

<defs>
